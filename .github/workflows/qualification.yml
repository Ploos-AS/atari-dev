name: qualification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  m2:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build canonical Atari toolchain image
        run: docker build -t atari-dev:m2 -f Containerfile .
      - name: Toolchain metadata
        run: docker run --rm atari-dev:m2 atari-toolchain-info
      - name: Build TOS and PRG qualification artifacts
        run: docker run --rm -v "$PWD:/work" atari-dev:m2 sh -c 'make clean check && make probe'
      - name: Upload Atari artifacts
        uses: actions/upload-artifact@v4
        with:
          name: atari-dev-m2-tos
          path: |
            build/HELLO.TOS
            build/HELLO.PRG
            build/MINIMAL.PRG
          if-no-files-found: error
