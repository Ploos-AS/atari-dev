name: qualification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  m1:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build atari-dev image
        run: docker build -t atari-dev:m1 -f Containerfile .
      - name: Toolchain metadata
        run: docker run --rm atari-dev:m1 atari-toolchain-info
      - name: M1 smoke qualification
        run: docker run --rm -v "$PWD:/work" atari-dev:m1 make clean check
